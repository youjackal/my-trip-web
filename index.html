    <!-- Tailwind CSS (啟用 class 策略以支援手動切換 dark mode) -->

    <style>
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: #f0f4f8;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            color: #1e293b;
            overscroll-behavior-y: none;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Dark Mode Body Override */
        html.dark body {
            background-color: #0f172a; /* slate-900 */
            color: #f1f5f9; /* slate-100 */
        }
        
        .app-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('https://images.unsplash.com/photo-1528164344705-47542687000d?q=80&w=2092&auto=format&fit=crop');
            background-size: cover;
            background-position: center center;
            z-index: -2;
            pointer-events: none;
            filter: blur(10px);
            transform: scale(1.1);
            transition: filter 0.5s ease;
        }

        /* Dark mode background dimmer */
        html.dark .app-bg {
            filter: blur(10px) brightness(0.4) grayscale(0.3);
        }

        .app-blur-layer {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.25); 
            backdrop-filter: blur(4px); 
            z-index: -1;
            pointer-events: none;
            transition: background-color 0.5s ease;
        }

        html.dark .app-blur-layer {
            background-color: rgba(15, 23, 42, 0.4);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .flight-card {
            background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
            color: white;
            position: relative;
            overflow: hidden;
        }
        html.dark .flight-card {
            background: linear-gradient(135deg, #1e3a8a 0%, #172554 100%);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .flight-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(circle at top right, rgba(255,255,255,0.2) 0%, transparent 60%);
            pointer-events: none;
        }
        .flight-line {
            border-top: 2px dashed rgba(255,255,255,0.4);
        }

        /* Light Mode Glass */
        .liquid-glass {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0.55) 100%);
            backdrop-filter: blur(24px) saturate(200%);
            -webkit-backdrop-filter: blur(24px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            border-right: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1), inset 0 0 0 1px rgba(255, 255, 255, 0.3), inset 0 10px 20px rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        /* Dark Mode Glass - Deep & Premium */
        html.dark .liquid-glass {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.85) 0%, rgba(15, 23, 42, 0.8) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            color: #f8fafc;
        }

        .liquid-glass::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.8) 50%, rgba(255, 255, 255, 0) 100%);
            transform: skewX(-25deg);
            pointer-events: none;
            opacity: 0.3; 
            transition: left 0.5s;
        }
        
        html.dark .liquid-glass::before {
             background: linear-gradient(to right, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.1) 50%, rgba(255, 255, 255, 0) 100%);
        }

        .liquid-glass:hover::before {
            opacity: 1;
            animation: shine 1.5s ease-out;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) skewX(-20deg); }
            100% { transform: translateX(100%) skewX(-20deg); }
        }
        
        /* Leaflet custom pin style */
        .custom-pin {
            background: transparent;
            border: none;
        }
        
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 蓋章動畫 */
        .animate-stamp {
            animation: stamp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes stamp {
            0% { opacity: 0; transform: scale(2) rotate(-15deg); }
            100% { opacity: 1; transform: scale(1.1) rotate(-15deg); }
        }

        /* 手機端拖放優化 */
        [draggable="true"] {
            -webkit-user-drag: element;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        .dnd-poly-drag-image {
            opacity: 1 !important;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3) !important;
            border-radius: 28px !important;
            width: 320px !important;
            height: auto !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            background-color: #ffffff !important;
            border: 2px solid rgba(0,0,0,0.05) !important;
            padding: 4px !important;
            transform: scale(1.02) !important;
            overflow: hidden !important;
        }
        
        /* Dark mode drag image styling */
        html.dark .dnd-poly-drag-image {
            background-color: #1e293b !important; /* slate-800 */
            border: 2px solid rgba(255,255,255,0.1) !important;
        }

        .dnd-poly-drag-image *,
        .dnd-poly-drag-image *::before,
        .dnd-poly-drag-image *::after {
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            filter: none !important;
            box-shadow: none !important;
            animation: none !important;
            transition: none !important;
        }

        .dnd-poly-drag-image .liquid-glass {
            background: #ffffff !important;
            border: 1px solid #e2e8f0 !important;
            backdrop-filter: none !important;
            box-shadow: none !important;
        }
        
        html.dark .dnd-poly-drag-image .liquid-glass {
            background: #1e293b !important;
            border: 1px solid #334155 !important;
            color: #f8fafc !important;
        }
        
        .dnd-poly-drag-image .flight-card {
            background: #3b82f6 !important;
            color: #ffffff !important;
            border-radius: 24px !important;
        }
        
        html.dark .dnd-poly-drag-image .flight-card {
            background: #1e3a8a !important;
        }
        
        .dnd-poly-drag-image .text-slate-800,
        .dnd-poly-drag-image .text-slate-700 {
            color: #1e293b !important;
        }
        
        html.dark .dnd-poly-drag-image .text-slate-800,
        html.dark .dnd-poly-drag-image .text-slate-700 {
            color: #f8fafc !important;
        }

        .dnd-item-container {
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s ease;
            will-change: transform;
        }
        
        .dnd-item-dragging {
            opacity: 0.1 !important;
            transform: scale(0.95) !important;
        }

        .dnd-item-pushed-up {
            transform: translateY(-8px) scale(0.99);
        }

        .dnd-item-pushed-down {
            transform: translateY(8px) scale(0.99);
        }
    </style>
